<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Múltiplas · Probabilidade Real</title>
<link rel="manifest" href="/static/manifest.webmanifest">
<meta name="theme-color" content="#0A0E1C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #131A2E;
    --bg-deep: #0A0E1C;
    --card: #1B2340;
    --card-header: #141B33;
    --card-border: #2C3660;
    --chalk: #F0EDE4;
    --chalk-dim: #9AA3C4;
    --gold: #F2A93B;
    --gold-dim: #A87627;
    --gold-glow: rgba(242,169,59,0.20);
    --danger: #E0554F;
    --danger-dim: rgba(224,85,79,0.16);
    --success: #4FBF8B;
    --success-dim: rgba(79,191,139,0.18);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg-deep);
    background-image: radial-gradient(circle at 50% 0%, rgba(242,169,59,0.07), transparent 55%);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-bottom: 48px;
  }
  ::selection { background: var(--gold-glow); }

  /* ---------- topo ---------- */
  .topo {
    background: var(--bg-deep);
    padding: 22px 20px 14px;
    border-bottom: 1px solid var(--card-border);
    position: sticky;
    top: 0;
    z-index: 20;
  }
  .marca { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 18px; }
  .marca-titulo {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
    letter-spacing: 0.02em;
    line-height: 1;
    color: var(--chalk);
  }
  .marca-titulo .accent { color: var(--gold); }
  .marca-sub {
    font-size: 0.72rem;
    color: var(--chalk-dim);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-top: 4px;
  }
  .btn-hist {
    background: none;
    border: 1px solid var(--card-border);
    border-radius: 999px;
    color: var(--chalk-dim);
    padding: 8px 16px;
    font-family: 'Inter', sans-serif;
    font-size: 0.76rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .btn-hist.ativo { color: var(--gold); border-color: var(--gold); background: var(--gold-glow); }

  .linha-scroll { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .linha-scroll::-webkit-scrollbar { display: none; }
  .linha-scroll + .linha-scroll { margin-top: 10px; }

  .pill {
    flex-shrink: 0;
    padding: 8px 15px;
    border-radius: 999px;
    border: 1px solid var(--card-border);
    background: transparent;
    color: var(--chalk-dim);
    font-family: 'Inter', sans-serif;
    font-size: 0.8rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: border-color .15s, color .15s, background .15s;
  }
  .pill.ativo { border-color: var(--gold); color: var(--gold); background: var(--gold-glow); }

  .pill-faixa { font-family: 'JetBrains Mono', monospace; }
  .pill-faixa .ponto {
    display: inline-block; width: 6px; height: 6px; border-radius: 50%;
    background: currentColor; margin-right: 6px; opacity: 0.7;
  }

  /* ---------- corpo ---------- */
  .corpo { padding: 18px 20px 0; max-width: 560px; margin: 0 auto; }

  .aviso {
    display: flex; gap: 10px; align-items: flex-start;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--gold-dim);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 18px;
    font-size: 0.8rem;
    color: var(--chalk-dim);
    line-height: 1.5;
  }
  .aviso b { color: var(--chalk); }

  .status-linha {
    font-size: 0.78rem;
    color: var(--chalk-dim);
    margin-bottom: 12px;
    font-family: 'Inter', sans-serif;
  }

  .vazio, .idle {
    text-align: center;
    color: var(--chalk-dim);
    padding: 44px 16px;
    font-size: 0.9rem;
    line-height: 1.6;
  }
  .idle .icone { font-size: 1.8rem; margin-bottom: 12px; opacity: 0.6; }

  /* ---------- bilhete (o elemento assinatura) ---------- */
  .bilhete {
    position: relative;
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 16px;
    margin-bottom: 22px;
    overflow: hidden;
    animation: surgir .3s ease both;
  }
  @keyframes surgir { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .bilhete-topo {
    background: var(--card-header);
    padding: 16px 18px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .bilhete-num {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.7rem;
    color: var(--chalk-dim);
    letter-spacing: 0.05em;
  }
  .bilhete-prob {
    font-family: 'Oswald', sans-serif;
    font-weight: 700;
    font-size: 2rem;
    color: var(--gold);
    line-height: 1;
  }
  .bilhete-prob small { font-size: 1rem; font-weight: 600; opacity: 0.8; }
  .bilhete-odd { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--chalk-dim); margin-top: 2px; }

  .bilhete-selo {
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.72rem;
    letter-spacing: 0.03em;
    padding: 5px 12px;
    border-radius: 999px;
  }
  .selo-pendente { background: rgba(159,176,162,0.14); color: var(--chalk-dim); }
  .selo-ganhou { background: var(--success-dim); color: var(--success); }
  .selo-perdeu { background: var(--danger-dim); color: var(--danger); }

  /* perfuração estilo ticket */
  .bilhete-corte {
    position: relative;
    height: 0;
    border-top: 1.5px dashed var(--card-border);
    margin: 0 14px;
  }
  .bilhete-corte::before, .bilhete-corte::after {
    content: "";
    position: absolute;
    top: -8px;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: var(--bg-deep);
  }
  .bilhete-corte::before { left: -28px; }
  .bilhete-corte::after { right: -28px; }

  .bilhete-selecoes { padding: 6px 18px 4px; }
  .selecao {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(31,78,51,0.6);
    cursor: pointer;
  }
  .selecao:last-child { border-bottom: none; }
  .selecao:active { opacity: 0.7; }
  .selecao-info { min-width: 0; }
  .selecao-jogo {
    font-size: 0.86rem;
    font-weight: 600;
    color: var(--chalk);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .selecao-mercado { font-size: 0.74rem; color: var(--chalk-dim); margin-top: 2px; }
  .selecao-pct {
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    font-size: 0.92rem;
    color: var(--gold);
    flex-shrink: 0;
  }

  .bilhete-rodape {
    padding: 10px 18px 14px;
    font-size: 0.68rem;
    color: var(--chalk-dim);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .bilhete-lucro { font-family: 'JetBrains Mono', monospace; font-weight: 700; }
  .lucro-pos { color: var(--success); }
  .lucro-neg { color: var(--danger); }

  /* ---------- histórico ---------- */
  .semana-card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .semana-topo { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
  .semana-titulo { font-family: 'Oswald', sans-serif; font-weight: 600; font-size: 0.9rem; text-transform: capitalize; }
  .semana-lucro { font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 1.05rem; }
  .semana-stats { display: flex; gap: 16px; font-size: 0.76rem; color: var(--chalk-dim); flex-wrap: wrap; }
  .semana-stats b { color: var(--chalk); }
  .semana-taxa {
    font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--gold);
    margin-left: auto;
  }
  .semana-rodape { font-size: 0.68rem; color: var(--chalk-dim); margin-top: 8px; opacity: 0.8; }

  .secao-titulo {
    font-family: 'Oswald', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--chalk);
    margin: 26px 0 12px;
    padding-top: 10px;
    border-top: 1px solid var(--card-border);
  }

  .spin { animation: girar 1s linear infinite; display: inline-block; }
  @keyframes girar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .btn-copiado {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(0);
    background: var(--gold);
    color: var(--bg-deep);
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 0.82rem;
    padding: 10px 20px;
    border-radius: 999px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.4);
    z-index: 50;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s, transform .2s;
  }
  .btn-copiado.mostrar { opacity: 1; transform: translateX(-50%) translateY(-8px); }
</style>
</head>
<body>

<div class="topo">
  <div class="marca">
    <div>
      <div class="marca-titulo">MÚLTIPLAS <span class="accent">·</span> PROB</div>
      <div class="marca-sub">Brasileirão A &amp; B — probabilidade real</div>
    </div>
    <button class="btn-hist" id="btnHistorico">Histórico</button>
  </div>
  <div class="linha-scroll" id="dias"></div>
  <div class="linha-scroll" id="faixas"></div>
</div>

<div class="corpo">
  <div id="resultado"></div>
</div>

<div class="btn-copiado" id="toastCopiado">✓ Copiado — abrindo Bet365</div>

<script>
const FAIXAS = ["50%", "60%", "70%", "80%", "90%"];

let dataEscolhida = new Date().toISOString().slice(0, 10);
let faixaEscolhida = "50%";
let telaAtual = "buscar"; // "buscar" | "historico"

function formatarDiaLabel(isoStr, idx) {
  if (idx === 0) return "Hoje";
  if (idx === 1) return "Amanhã";
  const d = new Date(isoStr + "T12:00:00");
  return d.toLocaleDateString("pt-BR", { weekday: "short", day: "2-digit" }).replace(".", "");
}

function montarDias() {
  const cont = document.getElementById("dias");
  cont.innerHTML = "";
  const hoje = new Date();
  for (let i = 0; i < 7; i++) {
    const d = new Date(hoje);
    d.setDate(hoje.getDate() + i);
    const iso = d.toISOString().slice(0, 10);
    const btn = document.createElement("button");
    btn.className = "pill" + (iso === dataEscolhida ? " ativo" : "");
    btn.textContent = formatarDiaLabel(iso, i);
    btn.onclick = () => {
      dataEscolhida = iso;
      montarDias();
      if (telaAtual === "buscar") buscar();
    };
    cont.appendChild(btn);
  }
}

function montarFaixas() {
  const cont = document.getElementById("faixas");
  cont.innerHTML = "";
  FAIXAS.forEach(f => {
    const btn = document.createElement("button");
    btn.className = "pill pill-faixa" + (f === faixaEscolhida ? " ativo" : "");
    btn.innerHTML = `<span class="ponto"></span>${f}+`;
    btn.onclick = () => {
      faixaEscolhida = f;
      montarFaixas();
      if (telaAtual === "buscar") renderResultadoAtual();
    };
    cont.appendChild(btn);
  });
}

let ultimoDataCarregada = null;

async function abrirNaBet365(jogoTexto) {
  try { await navigator.clipboard.writeText(jogoTexto); } catch (e) {}
  const toast = document.getElementById("toastCopiado");
  toast.classList.add("mostrar");
  setTimeout(() => toast.classList.remove("mostrar"), 1800);
  window.open("https://www.bet365.com/", "_blank");
}

function selecaoHtml(s, resultadoPerna) {
  let selo = "";
  if (resultadoPerna === true) {
    selo = `<span style="color:var(--success);font-weight:700;margin-right:6px;">✓</span>`;
  } else if (resultadoPerna === false) {
    selo = `<span style="color:var(--danger);font-weight:700;margin-right:6px;">✕</span>`;
  }
  return `
    <div class="selecao" onclick='abrirNaBet365(${JSON.stringify(s.jogo)})'>
      <div class="selecao-info">
        <div class="selecao-jogo">${selo}${s.jogo}</div>
        <div class="selecao-mercado">${s.mercado}${s.liga ? " · " + s.liga : ""}</div>
      </div>
      <div class="selecao-pct">${(s.prob_real * 100).toFixed(0)}%</div>
    </div>`;
}

function bilheteHtml(c, idx) {
  const resultadosPerna = c.selecoes_resultado || [];
  const selecoesHtml = c.selecoes.map((s, i) => selecaoHtml(s, resultadosPerna[i])).join("");
  let selo, rodapeExtra = "";
  if (c.resultado === "ganhou") {
    selo = `<span class="bilhete-selo selo-ganhou">✓ ACERTOU</span>`;
    rodapeExtra = `<span class="bilhete-lucro lucro-pos">+R$${(c.lucro ?? 0).toFixed(2)}</span>`;
  } else if (c.resultado === "perdeu") {
    selo = `<span class="bilhete-selo selo-perdeu">✕ ERROU</span>`;
    rodapeExtra = `<span class="bilhete-lucro lucro-neg">-R$10,00</span>`;
  } else if (c.resultado === "pendente") {
    selo = `<span class="bilhete-selo selo-pendente">Aguardando</span>`;
  } else {
    selo = `<span class="bilhete-selo selo-pendente">Prévia</span>`;
  }

  return `
    <div class="bilhete">
      <div class="bilhete-topo">
        <div>
          <div class="bilhete-num">MÚLTIPLA #${String(idx + 1).padStart(2, "0")}</div>
          <div class="bilhete-prob">${(c.prob_final * 100).toFixed(0)}<small>%</small></div>
          <div class="bilhete-odd">odd estimada ~${c.odd_estimada.toFixed(2)}</div>
        </div>
        ${selo}
      </div>
      <div class="bilhete-corte"></div>
      <div class="bilhete-selecoes">${selecoesHtml}</div>
      <div class="bilhete-rodape">
        <span>toque num jogo pra abrir a Bet365</span>
        ${rodapeExtra}
      </div>
    </div>`;
}

let ultimoResultado = null;

function renderResultadoAtual() {
  const cont = document.getElementById("resultado");
  const data = ultimoResultado;
  if (!data) return;

  const combos = (data.combinacoes_por_faixa && data.combinacoes_por_faixa[faixaEscolhida]) || [];
  let html = `
    <div class="aviso">
      <span>ℹ️</span>
      <div><b>Sem odds de casas de apostas</b> — dados públicos (ESPN). A odd mostrada é <b>estimada</b> a partir da própria probabilidade, só pra simular ganho/perda no histórico.</div>
    </div>`;

  if (combos.length > 0) {
    html += `<div class="status-linha">${combos.length} múltipla(s) com pelo menos ${faixaEscolhida} de chance por seleção</div>`;
    html += combos.map((c, i) => bilheteHtml(c, i)).join("");
  } else {
    const todasFaixasVazias = FAIXAS.every(f => !(data.combinacoes_por_faixa && data.combinacoes_por_faixa[f] && data.combinacoes_por_faixa[f].length));
    if (todasFaixasVazias && data.selecoes && data.selecoes.length > 0) {
      html += `<div class="status-linha">Poucos jogos hoje pra formar múltipla que compense — aqui vão as seleções individuais mais prováveis:</div>`;
      html += data.selecoes.slice(0, 8).map((s, i) => bilheteHtml({ selecoes: [s], prob_final: s.prob_real, odd_estimada: Math.round((1/Math.max(s.prob_real,0.03))*100)/100 }, i)).join("");
    } else {
      html += `<div class="vazio">Nenhuma múltipla na faixa ${faixaEscolhida}+ pra esse dia.<br>Tenta uma faixa menor ou outra data.</div>`;
    }
  }
  cont.innerHTML = html;
}

async function buscar() {
  const cont = document.getElementById("resultado");
  cont.innerHTML = `<div class="idle"><div class="icone spin">⏳</div>Buscando na ESPN (Série A + B)...<br>pode levar até 1 minuto na primeira vez do dia.</div>`;

  try {
    const resp = await fetch(`/api/espn-multiplas?data=${dataEscolhida}`);
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.erro || "Erro ao buscar.");
    ultimoResultado = data;
    renderResultadoAtual();
  } catch (e) {
    cont.innerHTML = `<div class="aviso" style="border-left-color:var(--danger);"><span>⚠️</span><div>${e.message}</div></div>`;
  }
}

function itemHistoricoHtml(item, idx) {
  return bilheteHtml(item, idx);
}

async function renderHistorico() {
  const cont = document.getElementById("resultado");
  cont.innerHTML = `<div class="idle"><div class="icone spin">⏳</div>Carregando histórico...</div>`;

  try {
    const resp = await fetch("/api/historico-prob");
    const data = await resp.json();

    let html = "";
    if (data.semanas && data.semanas.length > 0) {
      html += data.semanas.map(s => {
        const lucroClasse = s.lucro >= 0 ? "lucro-pos" : "lucro-neg";
        const lucroTexto = s.lucro >= 0 ? `+R$${s.lucro.toFixed(2)}` : `-R$${Math.abs(s.lucro).toFixed(2)}`;
        return `
        <div class="semana-card">
          <div class="semana-topo">
            <span class="semana-titulo">${s.semana.replace("-W", " · semana ")}</span>
            <span class="semana-lucro ${lucroClasse}">${lucroTexto}</span>
          </div>
          <div class="semana-stats">
            <span>✓ <b>${s.ganhou}</b> acertos</span>
            <span>✕ <b>${s.perdeu}</b> erros</span>
            <span>… <b>${s.pendente}</b> pendentes</span>
            ${s.taxa_acerto !== null ? `<span class="semana-taxa">${s.taxa_acerto}%</span>` : ""}
          </div>
          <div class="semana-rodape">simulado com R$10,00 por múltipla (odd estimada) · investido R$${s.investido.toFixed(2)}</div>
        </div>`;
      }).join("");
    } else {
      html += `<div class="vazio">Nenhum resumo semanal ainda.</div>`;
    }

    html += `<div class="secao-titulo">Todas as múltiplas geradas</div>`;
    html += data.itens && data.itens.length > 0
      ? data.itens.map(itemHistoricoHtml).join("")
      : `<div class="vazio">Nada gerado ainda — busque múltiplas pra começar.</div>`;

    cont.innerHTML = html;
  } catch (e) {
    cont.innerHTML = `<div class="aviso" style="border-left-color:var(--danger);"><span>⚠️</span><div>Não foi possível carregar o histórico.</div></div>`;
  }
}

document.getElementById("btnHistorico").addEventListener("click", () => {
  const btn = document.getElementById("btnHistorico");
  if (telaAtual === "buscar") {
    telaAtual = "historico";
    btn.textContent = "Buscar";
    btn.classList.add("ativo");
    document.getElementById("dias").style.display = "none";
    document.getElementById("faixas").style.display = "none";
    renderHistorico();
  } else {
    telaAtual = "buscar";
    btn.textContent = "Histórico";
    btn.classList.remove("ativo");
    document.getElementById("dias").style.display = "flex";
    document.getElementById("faixas").style.display = "flex";
    if (ultimoResultado) { renderResultadoAtual(); } else { buscar(); }
  }
});

montarDias();
montarFaixas();
buscar();
</script>
</body>
</html>
